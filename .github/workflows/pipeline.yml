name: Predictive Maintenance Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2
      - name: Register Dataset
        run: |
          python predictive_maintenance/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 scikit-learn==1.6.0
      - name: Run Data Preparation
        run: |
          python predictive_maintenance/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r predictive_maintenance/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Model Building and Evaluation
        run: |
          python predictive_maintenance/model_building/train.py
      - name: Verify Trained Model
        run: |
          test -f predictive_maintenance/deployment/model.joblib
      - name: Upload MLflow Tracking Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: mlruns
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictive_maintenance/deployment/model.joblib
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained model [skip ci]"
            git push origin main
          fi
